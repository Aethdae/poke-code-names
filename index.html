<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeNames</title>
    <script type="module" src="app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-800">
    <main id="main" class="max-w-[90%] mx-auto flex flex-col gap-4">
      <section id="pokeContainer" class="grid grid-cols-5 gap-2 my-1"></section>
      <div class="flex flex-col items-center bg-gray-400 py-4 gap-2">
        <p id="seedDisplay" class="bg-blue-600 text-white px-12 py-2">
          Press submit to begin.
        </p>
        <form
          id="seedForm"
          class="flex flex-col gap-2 max-w-[400px] items-center"
        >
          <label class="flex gap-2">
            Seed:
            <input
              class="bg-gray-200 border-1"
              type="text"
              name="seedInput"
              id="seedInput"
              placeholder="Enter a seed..."
            />
          </label>
          <button class="bg-gray-200 border-1 px-2 cursor-pointer">
            Submit
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
